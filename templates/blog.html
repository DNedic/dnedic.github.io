{% extends "base.html" %}

{% import "post-preview.html" as post_macros %}

{% block content %}
  <div class="section-heading">
    {{ section.content | replace(from="<h2", to="<h1") | replace(from="</h2>", to="</h1>") | safe }}
  </div>

  <div class="post-list">
    {% for post in section.pages %}
      {{ post_macros::post_preview(post=post) }}
    {% endfor %}
  </div>
{% endblock content %}
